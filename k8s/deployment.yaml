apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: real-estate-predictor
  template:
    metadata:
      labels:
        app: real-estate-predictor
    spec:
      containers:
        - name: predictor
          image: real-estate-predictor:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
