# Local coursework/demo only; do not expose this setup publicly.
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.2.3 numpy==1.26.4 scikit-learn==1.5.2 joblib==1.4.2 pytest==8.3.3"
  volumes:
    - ./dags:/opt/airflow/dags
    - ..:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username airflow --password airflow --firstname Local --lastname Admin --role Admin --email airflow@example.com || true
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
